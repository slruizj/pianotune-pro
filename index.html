function agregarCuerdaItem(){
  const tipo = _cue.tipo;
  const cats = CUE_CATS[tipo];
  const cat  = cats.find(c=>c.id===_cue.catId)||cats[0];
  const tipoCuerda = detectTipoCuerda(_cue.nota, cat);
  const anchor = getCueAnchor(tipo, cat.id);
  const factor = getCueFactor(tipoCuerda);
  const precioUnit = Math.round(anchor * factor);
  _cue.items.push({
    label: cat.label,
    nota: _cue.nota,
    tipoCuerdaLabel: tipoCuerdaLabel(tipoCuerda),
    tipoCuerda,
    cant: _cue.cantidad,
    precioUnit
  });
  _cue.cantidad = 1;
  renderCotizadorCuerdas();
  showToast('Cuerda agregada ✓');
}

function quitarCuerdaItem(i){
  _cue.items.splice(i,1);
  renderCotizadorCuerdas();
}

function enviarCuerdaWA(){
  const total = _cue.items.reduce((s,it)=>s+it.precioUnit*it.cant,0);
  const desc  = Math.round(total*((state.cueDescTecnico||15)/100));
  let txt = '🎵 *Cotización Cuerdas Entorchadas*\nPianos & Pianos — Sergio Ruiz\n\n';
  _cue.items.forEach(it=>{
    txt += `• ${it.cant}× ${it.label} (${notaNombre(it.nota)})\n`;
    txt += `  ${it.tipoCuerdaLabel}: ${fmtMoney(it.precioUnit*it.cant)}\n`;
  });
  txt += `\n*Total: ${fmtMoney(total)}*`;
  if(desc>0) txt += `\nDescuento técnico: −${fmtMoney(desc)}\nTotal c/dto: ${fmtMoney(total-desc)}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

function agregarCotAPresupuesto(){
  showToast('Función disponible al crear presupuesto ✓');
}


// ══════════════════════════════════════════════════════════
// IMPRESIÓN TÉRMICA 55mm — ESC/POS via RawBT — v2.9.3
// Ancho fijo: 32 caracteres
// ══════════════════════════════════════════════════════════

const TP_W = 32; // caracteres por línea

function tpLine(txt=''){
  return txt.substring(0,TP_W).padEnd(TP_W)+'\n';
}
function tpSep(char='-'){
  return char.repeat(TP_W)+'\n';
}
function tpCenter(txt){
  const t=txt.substring(0,TP_W);
  const pad=Math.max(0,Math.floor((TP_W-t.length)/2));
  return (' '.repeat(pad)+t).padEnd(TP_W)+'\n';
}
function tpRight(lbl, val){
  const v=String(val).substring(0,TP_W-1);
  const l=String(lbl).substring(0,TP_W-v.length-1);
  return l+' '.repeat(TP_W-l.length-v.length)+v+'\n';
}
function tpFmtMoney(n){
  return '$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function tpFecha(iso){
  if(!iso)return'';
  const [y,m,d]=iso.split('-');
  const M=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${d}/${M[+m]}/${y}`;
}
function tpFolioOS(citaId){
  return 'OS-'+String(citaId||0).padStart(5,'0');
}

// ── Generar texto OS para impresión ────────────────────────
function tpGenerarOS(citaId){
  const cita = state.citas.find(c=>c.id===citaId);
  if(!cita)return'';
  const cli  = getCliente(cita.clienteId)||{nombre:'—'};
  const pno  = getPiano(cita.clienteId,cita.pianoId)||{};
  const tec  = state.tecnico||{};
  const cobro= cita.cobro||{};
  const items= cita.items||[{nombre:cita.servicio||'Servicio',precio:cita.precio||0}];
  const total= items.reduce((s,i)=>s+(i.precio||0),0);
  const iva  = Math.round(total*0.16/1.16);
  const sub  = total-iva;

  let t='';
  t+=tpCenter('PIANOS & PIANOS');
  t+=tpCenter(tec.nombre||'Sergio Ruiz');
  t+=tpCenter('Tel: '+(tec.telefono||''));
  t+=tpSep('=');
  t+=tpCenter('ORDEN DE SERVICIO');
  t+=tpRight('Folio:',tpFolioOS(citaId));
  t+=tpRight('Fecha:',tpFecha(cita.fecha||new Date().toISOString().split('T')[0]));
  t+=tpSep();
  t+=tpLine('CLIENTE');
  t+=tpLine((cli.nombre||'').substring(0,TP_W));
  if(cli.telefono) t+=tpLine('Tel: '+cli.telefono);
  t+=tpSep();
  t+=tpLine('INSTRUMENTO');
  t+=tpLine(((pno.marca||'')+' '+(pno.modelo||'')).trim().substring(0,TP_W));
  t+=tpLine(((pno.tipo||'')+' '+(pno.subtipo||'')).trim().substring(0,TP_W));
  if(pno.serie) t+=tpLine('Serie: '+pno.serie);
  t+=tpSep();
  t+=tpLine('SERVICIOS REALIZADOS');
  items.forEach(item=>{
    const nom=(item.nombre||'').substring(0,22);
    const pr=tpFmtMoney(item.precio||0);
    t+=nom.padEnd(TP_W-pr.length)+pr+'\n';
  });
  t+=tpSep();
  t+=tpRight('Subtotal:',tpFmtMoney(sub));
  t+=tpRight('IVA 16%:',tpFmtMoney(iva));
  t+=tpSep('=');
  t+=tpRight('TOTAL:',tpFmtMoney(total));
  t+=tpSep('=');
  if(cobro.monto){
    t+=tpRight('COBRADO:',tpFmtMoney(cobro.monto));
    t+=tpRight('Forma de pago:',cobro.formaPago||'');
  }
  t+=tpSep();
  t+=tpLine('Tecnico: '+(tec.nombre||''));
  t+=tpLine('Firma: '+'_'.repeat(TP_W-7));
  t+=tpSep();
  t+=tpCenter('Gracias por su preferencia');
  t+=tpCenter('pianosandpianos.com');
  t+='\n\n\n'; // avance de papel
  return t;
}

// ── Generar texto Presupuesto ──────────────────────────────
function tpGenerarPresupuesto(presId){
  const pres = state.presupuestos?.find(p=>p.id===presId);
  if(!pres)return'';
  const cli  = getCliente(pres.clienteId)||{nombre:'—'};
  const pno  = getPiano(pres.clienteId,pres.pianoId)||{};
  const tec  = state.tecnico||{};
  const items= pres.items||[];
  const total= items.reduce((s,i)=>s+(i.precio||0),0);

  let t='';
  t+=tpCenter('PIANOS & PIANOS');
  t+=tpCenter(tec.nombre||'Sergio Ruiz');
  t+=tpSep('=');
  t+=tpCenter('PRESUPUESTO');
  t+=tpRight('Folio:','PRE-'+String(presId).padStart(4,'0'));
  t+=tpRight('Fecha:',tpFecha(pres.fecha||new Date().toISOString().split('T')[0]));
  t+=tpRight('Vigencia:','30 dias');
  t+=tpSep();
  t+=tpLine('CLIENTE');
  t+=tpLine((cli.nombre||'').substring(0,TP_W));
  t+=tpSep();
  t+=tpLine('INSTRUMENTO');
  t+=tpLine(((pno.marca||'')+' '+(pno.modelo||'')).trim().substring(0,TP_W));
  t+=tpSep();
  t+=tpLine('CONCEPTO');
  items.forEach(item=>{
    const nom=(item.nombre||'').substring(0,22);
    const pr=tpFmtMoney(item.precio||0);
    t+=nom.padEnd(TP_W-pr.length)+pr+'\n';
  });
  t+=tpSep('=');
  t+=tpRight('TOTAL c/IVA:',tpFmtMoney(total));
  t+=tpSep('=');
  t+=tpCenter('Precios incluyen IVA');
  t+=tpCenter('Sujeto a revision del instrumento');
  t+='\n'+tpLine('Acepto el presupuesto:');
  t+=tpLine('Firma: '+'_'.repeat(TP_W-7));
  t+='\n\n\n';
  return t;
}

// ── Generar recibo de pago ─────────────────────────────────
function tpGenerarRecibo(citaId){
  const cita = state.citas.find(c=>c.id===citaId);
  if(!cita)return'';
  const cli  = getCliente(cita.clienteId)||{nombre:'—'};
  const cobro= cita.cobro||{};
  const tec  = state.tecnico||{};
  const total= cobro.monto||cita.precio||0;

  let t='';
  t+=tpCenter('PIANOS & PIANOS');
  t+=tpCenter(tec.nombre||'Sergio Ruiz');
  t+=tpSep('=');
  t+=tpCenter('RECIBO DE PAGO');
  t+=tpRight('Recibo:','REC-'+String(citaId).padStart(5,'0'));
  t+=tpRight('Fecha:',tpFecha(cobro.fechaCobro||new Date().toISOString().split('T')[0]));
  t+=tpSep();
  t+=tpLine('Recibi de:');
  t+=tpLine((cli.nombre||'').substring(0,TP_W));
  t+=tpSep();
  t+=tpLine('Concepto:');
  t+=tpLine((cita.servicio||'Servicio de piano').substring(0,TP_W));
  t+=tpSep('=');
  t+=tpRight('IMPORTE:',tpFmtMoney(total));
  t+=tpRight('Forma de pago:',cobro.formaPago||'Efectivo');
  t+=tpSep('=');
  t+='\n'+tpLine('Firma del tecnico:');
  t+=tpLine('_'.repeat(TP_W));
  t+='\n'+tpLine('Firma del cliente:');
  t+=tpLine('_'.repeat(TP_W));
  t+='\n\n\n';
  return t;
}

// ── Enviar a RawBT ─────────────────────────────────────────
function tpImprimir(texto, titulo){
  if(!texto){ showToast('Sin datos para imprimir'); return; }
  // RawBT intent URL — abre la app RawBT en Android con el texto
  const encoded = encodeURIComponent(texto);
  const url = 'rawbt:' + encoded;
  // Intentar abrir RawBT
  const a = document.createElement('a');
  a.href = url;
  a.click();
  showToast('📠 Enviando a impresora...');
}

function tpImprimirOS(citaId){
  tpImprimir(tpGenerarOS(citaId), 'Orden de Servicio');
}
function tpImprimirRecibo(citaId){
  tpImprimir(tpGenerarRecibo(citaId), 'Recibo de Pago');
}
function tpImprimirPresupuesto(presId){
  tpImprimir(tpGenerarPresupuesto(presId), 'Presupuesto');
}

// ── Vista previa en modal ──────────────────────────────────
function tpVistaPrevia(texto, titulo, printFn){
  if(!texto){ showToast('Sin datos'); return; }
  const lines = texto.split('\n').map(l=>`<div style="font-family:monospace;font-size:12px;white-space:pre;line-height:1.4">${l}</div>`).join('');
  openModal(`<div class="modal-title">📄 ${titulo}</div>
    <div style="background:#f5f5f5;border-radius:8px;padding:12px;max-height:50vh;overflow-y:auto;border:1px solid var(--border)">${lines}</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="(${printFn})()" class="btn btn-primary btn-full">📠 Imprimir (RawBT)</button>
    </div>`);
}
