<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PianoTune Pro — Sergio Ruiz</title>
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%231a56db'/><text y='140' x='96' text-anchor='middle' font-size='120'>🎹</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PianoTune Pro">
<meta name="theme-color" content="#1a56db">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#1a56db;--primary-light:#e8f0fe;
  --success:#0f9d58;--success-light:#e6f4ea;
  --danger:#d93025;--danger-light:#fce8e6;
  --warning:#f29900;--warning-light:#fef7e0;
  --text:#1c1c1e;--text2:#6e6e73;--text3:#aeaeb2;
  --bg:#f2f2f7;--surface:#fff;--border:#e5e5ea;
  --radius:12px;--radius-sm:8px;
  --nav-h:56px;--safe-b:env(safe-area-inset-bottom,34px);
}
@supports not (padding-bottom:env(safe-area-inset-bottom)){
  :root{--safe-b:34px;}
}
html,body{height:100%;height:100dvh}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px)}
.screen::-webkit-scrollbar{display:none}
.hidden{display:none!important}
/* NAV */
.nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);padding:6px 0 calc(8px + var(--safe-b));z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 1px;border:none;background:none;color:var(--text3);font-size:9px;font-weight:600;transition:color .15s;letter-spacing:.2px}
.nav-btn.active{color:var(--primary)}
.nav-icon{width:20px;height:20px;flex-shrink:0}
/* CARDS */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin:0 16px 12px}
.card-sm{padding:12px 14px}
.page-header{padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.page-title{font-size:20px;font-weight:700}
.page-sub{font-size:13px;color:var(--text2);margin-top:1px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:600;transition:transform .1s;white-space:nowrap}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-google{background:#fff;color:#3c4043;border:1px solid var(--border);font-weight:600}
.btn-sm{padding:7px 11px;font-size:13px}
.btn-xs{padding:5px 9px;font-size:12px}
.btn-full{width:100%}
.btn-wa{background:#25d366;color:#fff}
/* INPUTS */
.input-group{margin-bottom:13px}
.input-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block}
.input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--primary)}
textarea.input{resize:vertical;min-height:68px}
.select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236e6e73' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
/* TAGS */
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tag-green{background:var(--success-light);color:var(--success)}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.tag-red{background:var(--danger-light);color:var(--danger)}
.tag-yellow{background:var(--warning-light);color:var(--warning)}
.tag-gray{background:#f0f0f0;color:var(--text2)}
/* LIST */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.list-item:last-child{border-bottom:none}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--primary);flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.item-title{font-size:15px;font-weight:600}
.item-sub{font-size:12px;color:var(--text2);margin-top:1px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(20px + var(--safe-b));width:100%;max-width:430px;max-height:92dvh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:14px}
.modal-sub{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px}
/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 14px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:13px;cursor:pointer;position:relative}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700}
.cal-day.other-month{color:var(--text3)}
.cal-day-dot{width:4px;height:4px;border-radius:50%;position:absolute;bottom:4px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 14px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text3)}
/* EVENTS */
.event-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);margin:0 16px 8px;border-radius:var(--radius);border-left:4px solid transparent;cursor:pointer}
.event-green{border-left-color:var(--success)}
.event-blue{border-left-color:var(--primary)}
.event-red{border-left-color:var(--danger)}
.event-gray{border-left-color:var(--text3)}
/* SEGMENT */
.segment{display:flex;background:var(--bg);border-radius:var(--radius-sm);padding:3px;margin:0 16px 10px}
.seg-btn{flex:1;padding:7px;border:none;background:none;border-radius:7px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s}
.seg-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* BUDGET */
.budget-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.budget-row:last-child{border-bottom:none}
/* WEEK */
.week-event{border-radius:5px;padding:4px 7px;font-size:11px;font-weight:600;cursor:pointer}
.week-event-green{background:var(--success-light);color:var(--success)}
.week-event-blue{background:var(--primary-light);color:var(--primary)}
.week-event-red{background:var(--danger-light);color:var(--danger)}
/* FAB */
.fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);right:18px;width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(26,86,219,.4);z-index:50}
.fab:active{transform:scale(.93)}
/* SEARCH */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--radius-sm);padding:9px 12px;margin:8px 16px}
.search-input{flex:1;border:none;background:none;font-size:15px;color:var(--text);outline:none}
/* GPS */
.gps-card{background:var(--primary);border-radius:var(--radius);padding:14px;margin-bottom:13px;color:#fff}
.gps-coords{font-size:11px;opacity:.8;margin-top:3px;font-family:monospace}
/* SECTION */
.sec{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;padding:14px 16px 7px}
/* WEEK NAV */
.week-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.week-nav-title{font-size:15px;font-weight:600}
.icon-btn{width:32px;height:32px;border:none;background:var(--bg);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text)}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:400;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* PIANO */
.piano-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;border:1px solid var(--border)}
.piano-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--border);flex-shrink:0}
.piano-thumb-ph{width:38px;height:38px;border-radius:8px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
/* PIANO CARD DASHBOARD */
.piano-card-big{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:16px;margin-bottom:10px;cursor:pointer;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06);transition:box-shadow .15s}
.piano-card-big:active{box-shadow:0 1px 3px rgba(0,0,0,.08)}
.piano-thumb-big{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--primary-light);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--border)}
.piano-thumb-big img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.piano-status-badge{position:absolute;top:8px;left:68px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px}
.psb-afinado{background:#e6f4ea;color:#0f9d58}
.psb-reparacion{background:#fef7e0;color:#f29900}
.psb-urgente{background:#fce8e6;color:#d93025}
.psb-excelente{background:#e8f0fe;color:#1a56db}
/* WA ACTION MENU */
.wa-menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:0;transition:background .1s}
.wa-menu-item:first-child{border-radius:12px 12px 0 0}
.wa-menu-item:last-child{border-bottom:none;border-radius:0 0 12px 12px}
.wa-menu-item:active{background:var(--bg)}
.wa-menu-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
/* FORANEO TOGGLE */
.foraneo-toggle{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--warning-light);border-radius:var(--radius-sm);border:1.5px solid var(--warning);margin-bottom:10px;cursor:pointer}
.toggle-switch{width:40px;height:22px;border-radius:11px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle-switch.on{background:var(--warning)}
.toggle-switch::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch.on::after{left:20px}
/* CREDITS */
.credits-block{margin:24px 16px 8px;padding-top:20px;border-top:1px solid var(--border);text-align:center}
.credits-logo{font-size:22px;margin-bottom:6px}
.credits-app{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.3px}
.credits-dev{font-size:12px;color:var(--text3);margin-top:3px}
.credits-co{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic}
/* PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photo-wrap{position:relative;aspect-ratio:1}
.photo-thumb{border-radius:8px;object-fit:cover;width:100%;height:100%;cursor:pointer;display:block}
.photo-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
.photo-add{aspect-ratio:1;border-radius:8px;background:var(--bg);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;color:var(--text3)}
/* TECH PROFILE */
.tech-avatar{width:72px;height:72px;border-radius:50%;background:var(--primary-light);border:3px solid var(--primary);object-fit:cover;cursor:pointer}
.tech-avatar-ph{width:72px;height:72px;border-radius:50%;background:var(--primary-light);border:3px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--primary);cursor:pointer;flex-shrink:0}
/* CLIMA */
.weather-widget{background:linear-gradient(135deg,#1565c0,#1e88e5);border-radius:var(--radius);padding:14px 16px;margin:0 16px 12px;color:#fff;display:flex;align-items:center;justify-content:space-between}
/* SESSION */
.session-banner{background:linear-gradient(135deg,#0f3b9e,#1a56db);color:#fff;padding:14px 16px;margin:10px 16px;border-radius:var(--radius)}
/* SETTINGS */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.sr-title{font-size:15px;font-weight:500}
.sr-sub{font-size:12px;color:var(--text2)}
/* ESTADO */
.est-bueno{color:var(--success)}
.est-regular{color:var(--warning)}
.est-malo{color:var(--danger)}
/* ══════════════════════════════════════════════
   DESKTOP LAYOUT — v2.9.0
══════════════════════════════════════════════ */
/* Mobile defaults — sidebar/topbar ocultos */
#dt-sidebar{display:none}
#dt-topbar{display:none}
#dt-main{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
#dt-content{flex:1;overflow-y:auto;overflow-x:hidden}
#dt-content .screen{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px)}
/* Desktop overrides */
@media(min-width:1024px){
  body{max-width:100%;flex-direction:row;overflow:hidden;height:100vh}
  #dt-sidebar{display:flex!important}
  #dt-topbar{display:flex!important}
  #mobile-wrap{display:none!important}
  #dt-content .screen{padding-bottom:24px}
  /* Sidebar */
  #dt-sidebar{
    width:240px;min-width:240px;height:100vh;
    background:linear-gradient(160deg,#0f2460 0%,#1a3a8f 60%,#1a56db 100%);
    display:flex;flex-direction:column;flex-shrink:0;
    position:relative;z-index:50;
    box-shadow:4px 0 20px rgba(0,0,0,.18);
  }
  /* Main content wrapper */
  #dt-main{
    flex:1;display:flex;flex-direction:column;overflow:hidden;height:100vh;
    background:var(--bg);
  }
  /* Top bar */
  #dt-topbar{
    height:58px;min-height:58px;background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 24px;gap:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);z-index:20;position:relative;
  }
  /* Scrollable content area */
  #dt-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0;}
  #dt-content .screen{padding-bottom:24px;}
  #dt-content .screen::-webkit-scrollbar{display:none}
  /* Hide mobile elements */
  .nav{display:none!important}
  .fab{bottom:24px;right:28px;}
  /* Wider modal on desktop */
  .modal-overlay{align-items:center;}
  .modal{border-radius:16px;max-width:640px;width:90vw;max-height:88vh;padding:22px 24px 24px;}
  .modal-handle{display:none}
  /* Toast at top right on desktop */
  .toast{bottom:auto;top:20px;right:24px;left:auto;transform:none;}
  /* Page header on desktop */
  .page-header{padding:18px 24px 12px;position:sticky;top:0;z-index:10;}
  .page-title{font-size:22px}
  /* Cards wider */
  .card{margin:0 24px 12px}
  .stats-grid{padding:12px 24px}
  .event-item{margin:0 24px 8px}
  /* Sidebar nav items */
  .dt-nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 16px;
    border-radius:10px;margin:2px 10px;cursor:pointer;
    color:rgba(255,255,255,.72);font-size:14px;font-weight:600;
    transition:all .15s;border:none;background:none;width:calc(100% - 20px);text-align:left;
  }
  .dt-nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
  .dt-nav-item.active{background:rgba(255,255,255,.2);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .dt-nav-icon{width:18px;height:18px;flex-shrink:0;opacity:.9}
  /* Dashboard grid */
  .dt-kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:16px 24px 4px}
  .dt-kpi-card{background:var(--surface);border-radius:12px;padding:14px 16px;border:1px solid var(--border)}
  .dt-kpi-val{font-size:22px;font-weight:800;color:var(--primary);line-height:1}
  .dt-kpi-lbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:600}
  .dt-kpi-sub{font-size:11px;color:var(--text3);margin-top:2px}
  .dt-body{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:12px 24px 24px;align-items:start}
  .dt-col{display:flex;flex-direction:column;gap:14px}
  .dt-panel{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden}
  .dt-panel-hdr{padding:13px 16px 11px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .dt-panel-body{padding:0}
  .dt-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
  .dt-row:last-child{border-bottom:none}
  .dt-row:hover{background:var(--bg)}
}
@media(min-width:1024px) and (max-width:1280px){
  .dt-kpi-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<!-- ══ DESKTOP SIDEBAR ══ -->
<div id="dt-sidebar">
  <div style="padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:28px">🎹</span>
      <div>
        <div style="color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px">PianoTune Pro</div>
        <div style="color:rgba(255,255,255,.55);font-size:11px" id="dt-tecnico-name">Sergio Ruiz</div>
      </div>
    </div>
  </div>
  <div style="flex:1;padding:10px 0" id="dt-nav-menu"></div>
  <div id="dt-sync-side" style="margin:8px 10px 4px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px">
    ☁️ <span id="dt-sync-txt">Listo</span>
  </div>
  <div style="padding:10px 16px 14px">
    <div style="color:rgba(255,255,255,.35);font-size:10px;font-weight:600;letter-spacing:.4px">PianoTune Pro v2.9.4</div>
  </div>
</div>

<!-- ══ DESKTOP MAIN ══ -->
<div id="dt-main">
  <div id="dt-topbar">
    <div style="font-size:17px;font-weight:700;color:var(--text)" id="dt-screen-title">Inicio</div>
    <div style="flex:1"></div>
    <div id="sync-bar" style="display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:20px;background:var(--primary-light)">
      <span style="font-size:12px;font-weight:600;color:var(--primary)">☁️ Listo</span>

  s.citas.forEach(c=>{

const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzkT2CA2EydhaOfPVIshtKtapkLV7m86ieJBBI3AO_segC9shc9rAf5Of5gGKahpt_c/exec';
const SYNC_SECRET='pianotune_2025_sync';
let _syncTimer=null;
let _syncStatus='idle'; // idle | syncing | ok | error

function saveState(){
  try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(pushToCloud,5000);
}
async function pushToCloud(){
  // v2.8.3 — guard: no push en primer arranque hasta haber hecho pull
  if(!state._hasPulled){
    console.log('Push bloqueado: esperando pull inicial');
    await pullFromCloud();return;
  }
  state._syncTs=Date.now();
  try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
  _syncStatus='syncing';updateSyncBar();
  try{
    const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({secret:SYNC_SECRET,data:JSON.stringify(state),device:state.tecnico?.nombre||'dispositivo',ts:state._syncTs})});
    const json=await res.json();
    _syncStatus=json.ok?'ok':'error';
    if(!json.ok)console.warn('Sync push:',json.error);
  }catch(err){_syncStatus='error';console.warn('Sync push failed:',err);}
  updateSyncBar();
}
async function pullFromCloud(){
  _syncStatus='syncing';updateSyncBar();
  try{
    const res=await fetch(`${SCRIPT_URL}?secret=${SYNC_SECRET}&_=${Date.now()}`);
    const json=await res.json();
    if(json.ok&&json.data&&json.data!=='{}'){
      const remote=JSON.parse(json.data);
      if((remote._syncTs||0)>(state._syncTs||0)){
        migrate(remote);Object.assign(state,remote);
        try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
        recalcEstados();renderScreen(currentScreen);
        showToast('☁️ Datos actualizados desde la nube ✓');
      }
    }
    // v2.8.3 — marcar que ya hicimos pull, habilitar push
    state._hasPulled=true;
    try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
    _syncStatus='ok';
  }catch(err){_syncStatus='error';console.warn('Sync pull failed:',err);}
  updateSyncBar();
}
function updateSyncBar(){
  const el=document.getElementById('sync-bar');if(!el)return;
  const cfg={idle:{i:'☁️',t:'Listo',bg:'var(--primary-light)',c:'var(--primary)'},
    syncing:{i:'🔄',t:'Sincronizando...',bg:'var(--warning-light)',c:'var(--warning)'},
    ok:{i:'✅',t:'Sincronizado',bg:'var(--success-light)',c:'var(--success)'},
    error:{i:'⚠️',t:'Sin conexión (local)',bg:'#fff3e0',c:'#e65100'}};
  const d=cfg[_syncStatus]||cfg.idle;
  el.style.background=d.bg;
  el.innerHTML=`<span style="font-size:12px;font-weight:600;color:${d.c}">${d.i} ${d.t}</span>
    <button class="btn btn-xs btn-ghost" style="margin-left:auto;font-size:11px" onclick="pullFromCloud()">↓ Actualizar</button>`;
  if(typeof dtUpdateSyncSide==='function')dtUpdateSyncSide();
}
function recalcEstados(){

  const activos=['en_curso','pausado','cerrado_sin_cobro','cobrado_efectivo','cobrado_transferencia','depositado','por_facturar','facturado','cancelado'];

    if(activos.includes(c.estado))return;

}

function capturarGPS(cbOk,cbErr){
  if(!navigator.geolocation){cbErr('GPS no disponible en este dispositivo');return;}
  try{
    navigator.geolocation.getCurrentPosition(
      pos=>cbOk(pos.coords.latitude,pos.coords.longitude),
      err=>{
        let msg='No se pudo obtener la ubicación.';
        if(err.code===1)msg='Activa el GPS en Chrome para guardar la ubicación.';
        if(err.code===2)msg='Señal GPS no disponible. Intenta en exteriores.';
        if(err.code===3)msg='Tiempo de espera GPS agotado.';
        cbErr(msg);
      },
      {timeout:10000,maximumAge:30000,enableHighAccuracy:true}
    );
  }catch(e){cbErr('Error GPS: '+e.message);}
}

// ══ SESIÓN / KM ══
function iniciarServicio(citaId){
  showToast('Obteniendo posición GPS…');
  capturarGPS(
    (lat,lon)=>{state.sesionActiva={citaId,inicio:Date.now(),latInicio:lat,lonInicio:lon};saveState();closeModal();showToast('Servicio iniciado ✓ GPS registrado');renderInicio();},
    msg=>{state.sesionActiva={citaId,inicio:Date.now(),latInicio:null,lonInicio:null};saveState();closeModal();showToast('Servicio iniciado (sin GPS: '+msg+')');renderInicio();}
  );
}
function cancelarSesion(){
  if(!confirm('¿Cancelar el servicio en curso? No se registrarán km.'))return;
  state.sesionActiva=null;saveState();showToast('Sesión cancelada');renderInicio();
}
function reagendarSesion(){
  const s=state.sesionActiva;if(!s)return;
  const c=state.citas.find(x=>x.id===s.citaId);
  state.sesionActiva=null;saveState();
  closeModal();reprogramarCita(c.id);
}
function capturarGPSClienteInline(clienteId){
  showToast('Capturando GPS…');
  capturarGPS(
    (lat,lon)=>{const c=getCliente(clienteId);if(c){c.lat=lat;c.lon=lon;saveState();showToast('GPS guardado ✓ Toca "Ir" para navegar');renderInicio();}},
    msg=>showToast('⚠ '+msg,4000)
  );
}
function terminarServicio(){
  const s=state.sesionActiva;if(!s)return;
  const cita=state.citas.find(c=>c.id===s.citaId);
  const cli=cita?getCliente(cita.clienteId):null;
  capturarGPS(
    (lat,lon)=>{
      let km=0;
      if(s.latInicio&&s.lonInicio)km=distKm(s.latInicio,s.lonInicio,lat,lon);
      else if(cli&&cli.lat&&cli.lon)km=distKm(lat,lon,cli.lat,cli.lon);
      state.kmTotal+=km*2;state.sesionActiva=null;
      if(cita&&cita.estado!=='realizado')cita.estado='realizado';
      saveState();showToast(`Finalizado. +${(km*2).toFixed(1)} km registrados ✓`);renderInicio();},
    ()=>{state.sesionActiva=null;if(cita&&cita.estado!=='realizado')cita.estado='realizado';saveState();showToast('Servicio finalizado');renderInicio();}
  );
}

    const activos=citas.filter(ct=>!['facturado','cobrado_transferencia','cobrado_efectivo','depositado','por_facturar'].includes(ct.estado)&&ct.estado!=='cancelado').sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const todos=[...activos,...completados];
    if(!todos.length)return'<p style="font-size:13px;color:var(--text2);padding:8px 0">Sin servicios registrados</p>';
    return todos.map(ct=>{
      const col=citaColor(ct);const piano=getPiano(ct.clienteId,ct.pianoId);
      const total=(ct.ordenServicio?.items?.length?ct.ordenServicio.items.reduce((s,i)=>s+Number(i.precio),0):ct.cobro?.monto||ct.precio)||0;
      const esFacturado=['facturado','cobrado_transferencia','cobrado_efectivo','depositado','por_facturar'].includes(ct.estado);
      return`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600">${ct.servicio}</div>
          <div style="font-size:11px;color:var(--text2)">${piano?piano.marca+' '+piano.modelo:''} · ${fmtDate(ct.fecha)}</div>
          <span class="tag ${col==='green'||esFacturado?'tag-green':col==='blue'?'tag-blue':col==='red'?'tag-red':'tag-gray'}" style="margin-top:3px;font-size:9px">${estadoLabel(ct)}</span>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:700;font-size:13px;color:var(--success)">${fmtMoney(total)}</div>
          ${esFacturado?`<button class="btn btn-ghost btn-xs" style="margin-top:4px" onclick="abrirPDF_OS(${ct.id})">📝 OS</button>
              <button class="btn btn-ghost btn-xs" style="margin-top:4px" onclick="tpVistaPrevia(tpGenerarRecibo(${ct.id}),'Recibo',()=>tpImprimirRecibo(${ct.id}))">🖨️ Recibo</button>`:''}
        </div>
      </div>`;
    }).join('');
  })()}
  <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
    <button class="btn btn-danger btn-full" onclick="eliminarCliente(${id})">🗑 Eliminar cliente</button>
  </div>`);
}

function eliminarCliente(id){

  state.clientes=state.clientes.filter(x=>x.id!==id);
  state.citas=state.citas.filter(x=>x.clienteId!==id);
  state.presupuestos=state.presupuestos.filter(x=>x.clienteId!==id);
  saveState();closeModal();showToast('Cliente eliminado');renderClientes();
}

function agregarFoto(cId,pId,inp){

// ── Importar desde Google Contacts (People API) ────────────────
async function importarContactoGoogle(){
  const token=state.googleUser?._token;
  if(!token){
    // Token real no disponible aún (pendiente fix OAuth con scope contacts)
    // Por ahora mostrar modal de búsqueda manual
    openModal(`<div class="modal-title">📋 Importar contacto</div>
    <div style="background:var(--primary-light);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--primary)">
      💡 La sincronización con Google Contacts estará disponible al resolver el fix OAuth. Por ahora ingresa el nombre para buscar.
    </div>
    <div class="input-group"><label class="input-label">Nombre a buscar</label><input class="input" id="manual-contact-name" placeholder="Ej. Juan García"></div>
    <div class="input-group"><label class="input-label">Teléfono</label><input class="input" type="tel" id="manual-contact-tel"></div>
    <div class="input-group"><label class="input-label">Email</label><input class="input" type="email" id="manual-contact-email"></div>
    <div class="input-group"><label class="input-label">Dirección</label><input class="input" id="manual-contact-dir"></div>
    <button class="btn btn-primary btn-full" onclick="seleccionarContacto(document.getElementById('manual-contact-name').value,document.getElementById('manual-contact-tel').value,document.getElementById('manual-contact-email').value,document.getElementById('manual-contact-dir').value)">Usar estos datos →</button>`);
    return;
  }
  const btn=document.getElementById('btn-import-contact');
  if(btn){btn.textContent='Buscando…';btn.disabled=true;}
  try{
    const q=(document.getElementById('nc-n')?.value||'').trim();
    const url=`https://people.googleapis.com/v1/people/me/connections?personFields=names,phoneNumbers,emailAddresses,addresses&pageSize=30${q?`&requestSyncToken=false`:''}`;
    const resp=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    if(!resp.ok){
      if(resp.status===401){showToast('Token expirado — vuelve a iniciar sesión',3000);}
      else showToast('Error al consultar contactos ('+resp.status+')',3000);
      return;
    }
    const data=await resp.json();
    const conns=(data.connections||[]).filter(c=>c.names?.length);
    if(!conns.length){showToast('No se encontraron contactos',3000);return;}
    // Show picker modal
    openModal(`<div class="modal-title">📋 Contactos de Google</div>
    <div class="input-group"><input class="input" id="contact-search" placeholder="Buscar nombre…" oninput="filtrarContactos()" style="margin-bottom:8px"></div>
    <div id="contact-list" style="max-height:55vh;overflow-y:auto">
      ${conns.map((c,i)=>{
        const nombre=c.names[0]?.displayName||'';
        const tel=(c.phoneNumbers||[])[0]?.value||'';
        const email=(c.emailAddresses||[])[0]?.value||'';
        const dir=(c.addresses||[])[0]?.formattedValue||'';
        return `<div class="contact-row" data-nombre="${nombre}" data-tel="${tel}" data-email="${email}" data-dir="${dir}"
          style="padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center"
          onclick="seleccionarContacto('${nombre.replace(/'/g,"\'")}','${tel.replace(/'/g,"\'")}','${email.replace(/'/g,"\'")}','${dir.replace(/'/g,"\'")}')">
          <div>
            <div style="font-weight:600;font-size:14px">${nombre}</div>
            <div style="font-size:12px;color:var(--text2)">${tel}${email?' · '+email:''}</div>
          </div>
          <span style="font-size:18px;color:var(--primary)">→</span>
        </div>`;
      }).join('')}
    </div>`);
    // Store for filter
    window._gContacts=conns;
  }catch(e){
    showToast('Error de red: '+e.message,3000);
  }finally{
    if(btn){btn.textContent='📋 Importar de Contactos';btn.disabled=false;}
  }
}
function filtrarContactos(){
  const q=(document.getElementById('contact-search')?.value||'').toLowerCase();
  document.querySelectorAll('.contact-row').forEach(row=>{
    row.style.display=row.dataset.nombre.toLowerCase().includes(q)?'':'none';
  });
}
function seleccionarContacto(nombre,tel,email,dir){
  closeModal();
  // Reopen nuevo cliente with pre-filled data
  showModalNuevoCliente(false);
  setTimeout(()=>{
    const set=(id,val)=>{const el=document.getElementById(id);if(el&&val)el.value=val;};
    set('nc-n',nombre);set('nc-t',tel);set('nc-e',email);set('nc-d',dir);
  },80);
}

  </div>

function subtipOpts(tipo,sel){return(PIANO_TIPOS[tipo]||PIANO_TIPOS['Vertical']).map(s=>`<option value="${s}" ${s===sel?'selected':''}>${s}</option>`).join('');}

// ══ SCREEN: CALENDARIO ══
let calView='mensual',calDate=new Date();
function renderCalendario(){
  document.getElementById('screen-calendario').innerHTML=`
  <div class="page-header"><div class="page-title">Calendario</div></div>
  <div class="segment">
    <button class="seg-btn ${calView==='semanal'?'active':''}" onclick="calView='semanal';renderCalendario()">Semanal</button>
    <button class="seg-btn ${calView==='mensual'?'active':''}" onclick="calView='mensual';renderCalendario()">Mensual</button>
  </div>
  ${calView==='mensual'?renderCalMensual():renderCalSemanal()}`;
}
function renderCalMensual(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const startDow=(first.getDay()+6)%7;
  const mName=calDate.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const byDate={};state.citas.forEach(c=>(byDate[c.fecha]||(byDate[c.fecha]=[])).push(c));
  const todayStr=new Date().toISOString().split('T')[0];
  let days='';
  for(let i=0;i<startDow;i++)days+='<div class="cal-day other-month"></div>';
  for(let d=1;d<=last.getDate();d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=iso===todayStr;
    const citas=byDate[iso]||[];
    const dots=[...new Set(citas.map(c=>citaColor(c)))].slice(0,3).map(col=>`<div class="cal-day-dot" style="background:${col==='green'?'var(--success)':col==='blue'?'var(--primary)':col==='red'?'var(--danger)':'var(--text3)'}"></div>`).join('');
    days+=`<div class="cal-day${isToday?' today':''}" onclick="showModalDia('${iso}')">${d}${dots}</div>`;
  }
  return`<div class="week-nav">
    <button class="icon-btn" onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendario()">‹</button>
    <span class="week-nav-title">${mName.charAt(0).toUpperCase()+mName.slice(1)}</span>
    <button class="icon-btn" onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendario()">›</button>
  </div>
  <div class="cal-weekdays"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
  <div class="cal-grid">${days}</div>
  <div class="sec">Citas del mes</div>${renderEventListMes(y,m)}`;
}
function renderEventListMes(y,m){
  const pfx=`${y}-${String(m+1).padStart(2,'0')}`;
  const citas=state.citas.filter(c=>c.fecha.startsWith(pfx)).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  if(!citas.length)return'<div style="text-align:center;padding:20px;color:var(--text2);font-size:14px">Sin citas este mes</div>';
  return citas.map(c=>{const cli=getCliente(c.clienteId);const col=citaColor(c);
    return`<div class="event-item event-${col}" onclick="showModalDetalleCita(${c.id})">
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${cli?cli.nombre:'?'}</div>
      <div style="font-size:12px;color:var(--text2)">${c.servicio} · ${c.hora}</div></div>
      <span class="tag tag-${col==='green'?'green':col==='blue'?'blue':col==='red'?'red':'gray'}">${c.estado}</span>
    </div>`;}).join('');
}
function renderCalSemanal(){
  const mon=new Date(calDate);mon.setDate(calDate.getDate()-(calDate.getDay()+6)%7);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
  const tStr=new Date().toISOString().split('T')[0];
  const lbl=['L','M','X','J','V','S','D'];
  const hours=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
  const dHead=`<div style="display:grid;grid-template-columns:44px repeat(7,1fr);padding:0 14px;gap:1px;margin:8px 0 4px">
    <div></div>${days.map((d,i)=>{const iso=d.toISOString().split('T')[0];const isT=iso===tStr;
      return`<div style="text-align:center;font-size:10px;font-weight:700;color:${isT?'var(--primary)':'var(--text2)'}">${lbl[i]}<br><span style="font-size:15px;font-weight:700;color:${isT?'var(--primary)':'var(--text)'}">${d.getDate()}</span></div>`;}).join('')}
  </div>`;
  const rows=hours.map(h=>{
    const cells=days.map(d=>{const iso=d.toISOString().split('T')[0];
      const citas=state.citas.filter(c=>c.fecha===iso&&c.hora===h);
      return`<div style="border-left:1px solid var(--border);padding:2px;min-height:44px">
        ${citas.map(c=>{const col=citaColor(c);const cli=getCliente(c.clienteId);
          return`<div class="week-event week-event-${col}" onclick="showModalDetalleCita(${c.id})">${cli?cli.nombre.split(' ')[0]:'?'}</div>`;}).join('')}
      </div>`;}).join('');
    return`<div style="display:grid;grid-template-columns:44px repeat(7,1fr);padding:0 14px;border-bottom:1px solid var(--border)">
      <div style="font-size:10px;color:var(--text3);padding-top:4px">${h}</div>${cells}</div>`;}).join('');
  return`<div class="week-nav">
    <button class="icon-btn" onclick="calDate=new Date(calDate);calDate.setDate(calDate.getDate()-7);renderCalendario()">‹</button>
    <span class="week-nav-title">${days[0].getDate()} – ${days[6].getDate()} ${mon.toLocaleDateString('es-MX',{month:'short'})}</span>
    <button class="icon-btn" onclick="calDate=new Date(calDate);calDate.setDate(calDate.getDate()+7);renderCalendario()">›</button>
  </div>${dHead}<div style="overflow-y:auto;max-height:480px">${rows}</div>`;
}
function showModalDia(iso){
  const citas=state.citas.filter(c=>c.fecha===iso).sort((a,b)=>a.hora.localeCompare(b.hora));
  openModal(`<div class="modal-title">📅 ${fmtDate(iso)}</div>
  ${citas.length===0?'<p style="color:var(--text2);font-size:14px">Sin citas este día.</p>':
    citas.map(c=>{const cli=getCliente(c.clienteId);const col=citaColor(c);
      return`<div class="event-item event-${col}" onclick="closeModal();showModalDetalleCita(${c.id})" style="border-radius:8px;margin-bottom:6px">
        <div style="flex:1"><div style="font-weight:600">${cli?cli.nombre:'?'}</div>
        <div style="font-size:12px;color:var(--text2)">${c.servicio} · ${c.hora}</div></div>
        <span class="tag tag-${col==='green'?'green':col==='blue'?'blue':'red'}">${c.estado}</span>
      </div>`;}).join('')}
  <button class="btn btn-primary btn-full" style="margin-top:10px" onclick="closeModal();showModalNuevaCita('${iso}')">+ Nueva cita este día</button>`);
}

// ══ MODAL: DETALLE CITA ══
function showModalDetalleCita(id){
  const c=state.citas.find(x=>x.id===id);if(!c)return;
  const cli=getCliente(c.clienteId);const piano=getPiano(c.clienteId,c.pianoId);const col=citaColor(c);
  const isSes=state.sesionActiva&&state.sesionActiva.citaId===id;
  const durH=c.duracionH||+(((c.duracion||90)/60).toFixed(1));
  const hasGPS=cli&&cli.lat&&cli.lon;
  const gpsRow=hasGPS
    ?`<button class="btn btn-primary btn-full" style="margin-bottom:8px" onclick="irAUbicacion(${c.clienteId})">🗺 Ir al destino</button>`
    :`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        ${cli&&cli.direccion?`<button class="btn btn-outline btn-sm" onclick="irAUbicacion(${c.clienteId})">🗺 Ir (texto)</button>`:'<div></div>'}
        <button class="btn btn-ghost btn-sm" onclick="capturarGPSClienteInline(${c.clienteId})">📍 Capturar GPS</button>
      </div>`;
  const actionButtons=()=>{
    if(['facturado','cancelado','cobrado_efectivo','cobrado_transferencia','depositado','por_facturar','cerrado_sin_cobro'].includes(c.estado)) return '';
    if(isSes) return `
      <button class="btn btn-success btn-full" onclick="terminarServicio()">✓ Finalizar y registrar km</button>
      <button class="btn btn-danger btn-full" style="margin-top:6px" onclick="cancelarSesion()">✕ Cancelar servicio en curso</button>
      <button class="btn btn-outline btn-full" style="margin-top:6px" onclick="reagendarDesdeDetalle(${id})">📅 Reagendar / Cambiar fecha</button>`;
    return `
      <button class="btn btn-success btn-full" onclick="iniciarServicio(${id})">🔧 Iniciar servicio (GPS)</button>
      <button class="btn btn-ghost btn-full" style="margin-top:6px" onclick="marcarRealizado(${id})">✓ Marcar realizado sin GPS</button>
      <button class="btn btn-outline btn-full" style="margin-top:6px" onclick="reagendarDesdeDetalle(${id})">📅 Reagendar / Cambiar fecha</button>
      <button class="btn btn-danger btn-full" style="margin-top:6px" onclick="cancelarCita(${id})">✕ Cancelar cita</button>`;
  };
  openModal(`
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <div class="avatar">${cli?initials(cli.nombre):'?'}</div>
    <div><div style="font-weight:700;font-size:16px">${cli?cli.nombre:'?'}</div>
    <div style="font-size:13px;color:var(--text2)">${piano?pianoLabel(piano):''}</div></div>
  </div>
  <div class="card" style="margin:0 0 12px;background:var(--bg)">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
      <div><span style="color:var(--text2)">Fecha</span><br><b>${fmtDate(c.fecha)}</b></div>
      <div><span style="color:var(--text2)">Hora</span><br><b>${c.hora}</b></div>
      <div><span style="color:var(--text2)">Servicio</span><br><b>${c.servicio}</b></div>
      <div><span style="color:var(--text2)">Precio</span><br><b>${fmtMoney(c.precio)}</b></div>
      <div><span style="color:var(--text2)">Duración</span><br><b>${durH}h</b></div>
      <div><span style="color:var(--text2)">GPS</span><br><b style="font-size:11px;color:${hasGPS?'var(--success)':'var(--danger)'}">${hasGPS?'✓ Guardado':'Sin coords'}</b></div>
    </div>
    <div style="margin-top:8px"><span class="tag tag-${col==='green'?'green':col==='blue'?'blue':col==='red'?'red':'gray'}">${c.estado}</span></div>
  </div>
  ${gpsRow}
  ${actionButtons()}
  ${cli?`<button class="btn btn-ghost btn-full" style="margin-top:6px" onclick="closeModal();showModalCliente(${cli.id})">Ver perfil del cliente</button>`:''}
  `);
}

function reagendarDesdeDetalle(id){
  const c=state.citas.find(x=>x.id===id);
  openModal(`<div class="modal-title">📅 Reagendar cita</div>
  <div class="input-group"><label class="input-label">Nueva fecha</label><input type="date" class="input" id="r-f" value="${c.fecha}"></div>
  <div class="input-group"><label class="input-label">Hora</label><input type="time" class="input" id="r-h" value="${c.hora}"></div>
  <div class="input-group"><label class="input-label">Duración (horas)</label><input type="number" class="input" id="r-dh" value="${c.duracionH||1.5}" step="0.5" min="0.5" max="8"></div>
  <button class="btn btn-primary btn-full" onclick="guardarReprogramar(${id})">Guardar nueva fecha</button>`);
}
function guardarReprogramar(id){
  const c=state.citas.find(x=>x.id===id);
  c.fecha=document.getElementById('r-f').value;
  c.hora=document.getElementById('r-h').value;
  c.duracionH=parseFloat(document.getElementById('r-dh').value)||1.5;
  c.estado='pendiente';
  saveState();closeModal();showToast('Cita reagendada ✓');renderScreen(currentScreen);
}
function reprogramarCita(id){reagendarDesdeDetalle(id);}

function marcarRealizado(id){
  state.citas.find(x=>x.id===id).estado='realizado';saveState();closeModal();showToast('Cita realizada ✓');renderScreen(currentScreen);
  setTimeout(()=>{const c=state.citas.find(x=>x.id===id);const cli=getCliente(c.clienteId);
    openModal(`<div class="modal-title">¿Agendar próxima?</div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:14px">¿Cuándo agendamos para <b>${cli?cli.nombre:'este cliente'}</b>?</p>
    <button class="btn btn-primary btn-full" onclick="agendarProxima(${id},6)">En 6 meses</button>
    <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="agendarProxima(${id},12)">En 12 meses</button>
    <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">No por ahora</button>`);},400);
}
function agendarProxima(citaId,meses){
  const orig=state.citas.find(x=>x.id===citaId);const nf=new Date(orig.fecha+'T00:00:00');nf.setMonth(nf.getMonth()+meses);
  state.citas.push({id:nextId(),clienteId:orig.clienteId,pianoId:orig.pianoId,fecha:nf.toISOString().split('T')[0],hora:orig.hora,estado:'pendiente',servicio:orig.servicio,duracionH:orig.duracionH||1.5,precio:orig.precio});
  saveState();closeModal();showToast(`Nueva cita en ${meses} meses ✓`);renderScreen(currentScreen);
}
function cancelarCita(id){if(!confirm('¿Cancelar esta cita?'))return;state.citas.find(x=>x.id===id).estado='cancelado';saveState();closeModal();showToast('Cita cancelada');renderScreen(currentScreen);}

// ── Selector de servicios inteligente ──────────────────────────
// Genera chips de categoría + lista filtrada, ocultando sub-items individuales
// de regulación (solo muestra los paquetes CAL-COL / CAL-VER)
function buildSvcSelector(wrapperId, inputId, priceId, preSelId){
  const agrupClaves = state.servicios.filter(s=>s.esAgrupado).flatMap(s=>s.subItems||[]);
  const visibles = state.servicios.filter(s => !agrupClaves.includes(s.clave));
  const cats = ['afinacion','reparacion','regulacion','entonacion','dkv'];
  const catLabels = {afinacion:'🎵 Afinación',reparacion:'🔧 Reparación',regulacion:'⚙️ Regulación',entonacion:'🎼 Entonación',dkv:'🎹 Disklavier'};
  const subBadge = {cola:'COLA',vertical:'VER',ambos:'',dkv:'DKV'};
  let activeCat = 'afinacion';

  function render(){
    const wrap = document.getElementById(wrapperId); if(!wrap) return;
    const filtered = activeCat === 'todos' ? visibles : visibles.filter(s=>s.categoria===activeCat);
    wrap.innerHTML = `
      <div style="display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none">
        ${cats.map(c=>`<button type="button" onclick="svcCatClick('${wrapperId}','${inputId}','${priceId}','${preSelId||''}','${c}')" style="flex-shrink:0;padding:4px 10px;border-radius:20px;border:1.5px solid ${activeCat===c?'var(--primary)':'var(--border)'};background:${activeCat===c?'var(--primary)':'var(--surface)'};color:${activeCat===c?'#fff':'var(--text2)'};font-size:11px;font-weight:600;cursor:pointer">${catLabels[c]}</button>`).join('')}
      </div>
      <select class="input select" id="${inputId}" onchange="svcSelChange('${inputId}','${priceId}')" style="margin-top:0">
        ${filtered.map(s=>{
          const badge = subBadge[s.subtipo]?` [${subBadge[s.subtipo]}]`:'';
          const pkg = s.esAgrupado?' 📦':'';
          return `<option value="${s.id}" data-precio="${s.precio}" ${s.id===preSelId?'selected':''}>${s.nombre}${badge}${pkg}</option>`;
        }).join('')}
      </select>`;
  }
  render();
  // Store active cat on wrapper for external access
  wrap._svcActiveCat = activeCat;
  wrap._svcRender = render;
}
function svcCatClick(wrapperId, inputId, priceId, preSelId, cat){
  const wrap = document.getElementById(wrapperId); if(!wrap) return;
  const cats = ['afinacion','reparacion','regulacion','entonacion','dkv'];
  const catLabels = {afinacion:'🎵 Afinación',reparacion:'🔧 Reparación',regulacion:'⚙️ Regulación',entonacion:'🎼 Entonación',dkv:'🎹 Disklavier'};
  const subBadge = {cola:'COLA',vertical:'VER',ambos:'',dkv:'DKV'};
  const agrupClaves = state.servicios.filter(s=>s.esAgrupado).flatMap(s=>s.subItems||[]);
  const visibles = state.servicios.filter(s => !agrupClaves.includes(s.clave));
  const filtered = visibles.filter(s=>s.categoria===cat);
  wrap.innerHTML = `
    <div style="display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none">
      ${cats.map(c=>`<button type="button" onclick="svcCatClick('${wrapperId}','${inputId}','${priceId}','${preSelId||''}','${c}')" style="flex-shrink:0;padding:4px 10px;border-radius:20px;border:1.5px solid ${cat===c?'var(--primary)':'var(--border)'};background:${cat===c?'var(--primary)':'var(--surface)'};color:${cat===c?'#fff':'var(--text2)'};font-size:11px;font-weight:600;cursor:pointer">${catLabels[c]}</button>`).join('')}
    </div>
    <select class="input select" id="${inputId}" onchange="svcSelChange('${inputId}','${priceId}')" style="margin-top:0">
      ${filtered.map(s=>{
        const badge = subBadge[s.subtipo]?` [${subBadge[s.subtipo]}]`:'';
        const pkg = s.esAgrupado?' 📦':'';
        return `<option value="${s.id}" data-precio="${s.precio}">${s.nombre}${badge}${pkg}</option>`;
      }).join('')}
    </select>`;
  // Auto-update price on category switch
  svcSelChange(inputId, priceId);
}
function svcSelChange(inputId, priceId){
  const sel=document.getElementById(inputId); if(!sel) return;
  const opt=sel.options[sel.selectedIndex];
  const pi=document.getElementById(priceId);
  if(pi && opt) pi.value = opt.dataset.precio||'';
}

function showModalNuevaCita(fechaPre,preCliId,prePianoId,prePresupId){
  const hoy=fechaPre||new Date().toISOString().split('T')[0];
  const cliOpts=state.clientes.map(c=>`<option value="${c.id}" ${c.id===preCliId?'selected':''}>${c.nombre}</option>`).join('');
  const pianoInit=preCliId?buildPianoOpts(preCliId,prePianoId):'<option value="">Selecciona cliente</option>';
  const presupInit=preCliId?buildPresupOpts(preCliId,prePresupId):'<option value="">Selecciona cliente primero</option>';
  // Pre-select service from presupuesto if given
  let preServNom='',prePrecio='';
  if(prePresupId){const pp=state.presupuestos.find(x=>x.id===prePresupId);if(pp&&pp.items.length){preServNom=pp.items[0].nombre;prePrecio=pp.items[0].precio;}}
  openModal(`<div class="modal-title">Nueva cita</div>
  <div class="input-group"><label class="input-label">Cliente</label>
    <select class="input select" id="nca-c" onchange="updPianosNuevaCita();updPresupNuevaCita()">${cliOpts?`<option value="">Seleccionar…</option>${cliOpts}`:'<option>Sin clientes</option>'}</select></div>
  <div class="input-group"><label class="input-label">Piano</label>
    <select class="input select" id="nca-p">${pianoInit}</select></div>
  <div class="input-group"><label class="input-label">Presupuesto vinculado (opcional)</label>
    <select class="input select" id="nca-presup" onchange="updCitaDesdePresup()">${presupInit}</select></div>
  <div class="input-group"><label class="input-label">Fecha</label><input type="date" class="input" id="nca-f" value="${hoy}"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="input-group"><label class="input-label">Hora</label><input type="time" class="input" id="nca-h" value="10:00"></div>
    <div class="input-group"><label class="input-label">Duración (horas)</label><input type="number" class="input" id="nca-dh" value="1.5" step="0.5" min="0.5" max="8"></div>
  </div>
  <div class="input-group"><label class="input-label">Servicio principal</label>
    <div id="nca-svc-wrap"></div></div>
  <div class="input-group"><label class="input-label">Precio c/IVA</label><input type="number" class="input" id="nca-pr" value="${prePrecio||''}"></div>
  <div class="input-group"><label class="input-label">Anticipo recibido (si aplica)</label>
    <input type="number" class="input" id="nca-anticipo" value="0" placeholder="0"></div>
  <button class="btn btn-primary btn-full" onclick="crearCita()">Guardar cita</button>`);
  setTimeout(()=>{
    if(preCliId)document.getElementById('nca-c').value=preCliId;
    buildSvcSelector('nca-svc-wrap','nca-s','nca-pr');
    if(!prePrecio)svcSelChange('nca-s','nca-pr');
    if(prePresupId){const sel=document.getElementById('nca-presup');if(sel)sel.value=prePresupId;}
  },50);
}
function buildPresupOpts(cliId,selId){
  const ps=state.presupuestos.filter(p=>p.clienteId===parseInt(cliId));
  if(!ps.length)return'<option value="">Sin presupuestos</option>';
  return`<option value="">Sin vincular</option>`+ps.map(p=>`<option value="${p.id}" ${p.id===selId?'selected':''}>${fmtDate(p.fecha)} · ${fmtMoney(p.items.reduce((s,i)=>s+Number(i.precio),0))}</option>`).join('');
}
function updPresupNuevaCita(){
  const cliId=document.getElementById('nca-c')?.value;
  const sel=document.getElementById('nca-presup');
  if(sel)sel.innerHTML=cliId?buildPresupOpts(cliId):'<option value="">Selecciona cliente primero</option>';
}
function updCitaDesdePresup(){
  const presupId=parseInt(document.getElementById('nca-presup')?.value);
  if(!presupId)return;
  const pp=state.presupuestos.find(x=>x.id===presupId);if(!pp||!pp.items.length)return;
  const firstItem=pp.items[0];
  const prSel=document.getElementById('nca-s');
  const prPr=document.getElementById('nca-pr');
  // Add custom option for presupuesto item
  if(prSel){
    let opt=prSel.querySelector('option[value="0"]');
    if(!opt){opt=document.createElement('option');opt.value='0';prSel.prepend(opt);}
    opt.textContent=firstItem.nombre;opt.dataset.precio=firstItem.precio;
    prSel.value='0';
  }
  if(prPr)prPr.value=firstItem.precio;
  // Also set piano if presupuesto has one

function ssiUpdate(){
  // Recalcular total sumando precio del input de cada fila activa
  let total=0,activos=0,total_rows=0;
  document.querySelectorAll('.ssi-row').forEach(row=>{
    total_rows++;
    const cb=row.querySelector('.ssi-cb');
    const inp=row.querySelector('.ssi-price-inp');
    if(cb&&cb.checked){
      activos++;
      total+=inp?parseInt(inp.value)||0:0;
    }
    // Dim row when unchecked
    row.style.opacity=cb&&cb.checked?'1':'0.4';
  });
  const tot=document.getElementById('ssi-total');const cnt=document.getElementById('ssi-count');
  if(tot)tot.textContent=fmtMoney(total);
  if(cnt)cnt.textContent=activos+' de '+total_rows+' parámetros';
}
function ssiSelectAll(){
  document.querySelectorAll('.ssi-cb').forEach(c=>c.checked=true);ssiUpdate();
}
function showModalSubItems(id){
  const s=state.servicios.find(x=>x.id===id);
  if(!s||!s.subItems)return;

  const sel=s.subItemsActivos||s.subItems.slice();
  // Precios personalizados guardados, si existen
  const precios=s.subItemsPrecios||{};
  const totalInicial=subs.filter(x=>sel.includes(x.clave)).reduce((a,b)=>a+(precios[b.clave]!==undefined?precios[b.clave]:b.precio),0);
  const rows=subs.map(sub=>{
    const checked=sel.includes(sub.clave)?'checked':'';
    const precio=precios[sub.clave]!==undefined?precios[sub.clave]:sub.precio;
    const precioBase=sub.precio;
    const modificado=precio!==precioBase;
    return `<div class="ssi-row" data-clave="${sub.clave}" style="display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--border);opacity:${checked?'1':'0.4'}">
      <input type="checkbox" class="ssi-cb" data-clave="${sub.clave}" ${checked} onchange="ssiUpdate()" style="width:17px;height:17px;accent-color:var(--primary);flex-shrink:0">
      <span style="flex:1;font-size:13px;line-height:1.3">${sub.nombre}</span>

          <span style="font-size:10px;color:var(--text3)">$</span>
          <input type="number" class="ssi-price-inp" data-clave="${sub.clave}" data-base="${precioBase}" value="${precio}" min="0" oninput="ssiUpdate()" style="width:68px;padding:4px 6px;border:1.5px solid ${modificado?'var(--primary)':'var(--border)'};border-radius:6px;font-size:13px;font-weight:600;text-align:right;background:var(--surface);color:var(--text)">
        </div>
        ${modificado?`<span class="ssi-base-lbl" style="font-size:10px;color:var(--text3)">base $${precioBase}</span>`:`<span class="ssi-base-lbl" style="font-size:10px;color:var(--text3);visibility:hidden">base</span>`}
      </div>
    </div>`;
  }).join('');
  openModal(`<div class="modal-title">✏️ Modificar — ${s.nombre}</div>
  <div style="font-size:12px;color:var(--text2);margin-bottom:12px">Activa/desactiva parámetros y ajusta precios. El total se recalcula solo.</div>
  <div style="background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:11px;color:var(--text2)" id="ssi-count">${sel.length} de ${subs.length} parámetros</div>
    <div style="font-weight:700;font-size:17px;color:var(--primary)" id="ssi-total">${fmtMoney(totalInicial)}</div>
  </div>
  <div style="max-height:54vh;overflow-y:auto;padding:0 2px">${rows}</div>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn btn-ghost btn-xs" style="flex:1" onclick="ssiSelectAll()">Todos ✓</button>
    <button class="btn btn-ghost btn-xs" style="flex:1" onclick="ssiResetPrecios(${id})">Restablecer $</button>
    <button class="btn btn-primary btn-sm" style="flex:2" onclick="guardarSubItems(${id})">Aplicar</button>
  </div>`);
}
function ssiResetPrecios(id){
  // Restore all price inputs to base catalog price
  document.querySelectorAll('.ssi-price-inp').forEach(inp=>{
    inp.value=inp.dataset.base;
    inp.style.borderColor='var(--border)';
    const lbl=inp.closest('.ssi-row').querySelector('.ssi-base-lbl');
    if(lbl){lbl.style.visibility='hidden';}
  });
  ssiUpdate();
}
function guardarSubItems(id){
  const s=state.servicios.find(x=>x.id===id);
  // Collect active claves and custom prices
  const activos=[];const precios={};
  document.querySelectorAll('.ssi-row').forEach(row=>{
    const cb=row.querySelector('.ssi-cb');
    const inp=row.querySelector('.ssi-price-inp');
    const clave=row.dataset.clave;
    const base=parseInt(inp.dataset.base)||0;
    const val=parseInt(inp.value)||0;
    if(val!==base)precios[clave]=val; // only store if modified
    if(cb&&cb.checked)activos.push(clave);
  });
  s.subItemsActivos=activos;
  s.subItemsPrecios=precios;
  s.precio=activos.reduce((a,clave)=>{
    const sub=state.servicios.find(x=>x.clave===clave);
    const p=precios[clave]!==undefined?precios[clave]:(sub?sub.precio:0);
    return a+p;
  },0);
  s.duracion=activos.reduce((a,clave)=>{const sub=state.servicios.find(x=>x.clave===clave);return a+(sub?sub.duracion:0);},0);
  saveState();closeModal();showToast('Calibración actualizada · '+fmtMoney(s.precio)+' ✓');renderServicios();}

function agregarCuerdaAPresupuesto(){
  const tipo=_cue.tipo;
  const cat=CUE_CATS[tipo].find(c=>c.id===_cue.catId)||CUE_CATS[tipo][0];
  const tipoCuerda=detectTipoCuerda(_cue.nota,cat);
  const precioUnit=Math.round(getCueAnchor(tipo,cat.id)*getCueFactor(tipoCuerda));
  const nombre=`Cuerda ${tipoCuerdaLabel(tipoCuerda)} ${notaNombre(_cue.nota)} (${cat.label})`;
  for(let i=0;i<(_cue.cantidad||1);i++){
    pbItems.push({nombre, precio:precioUnit, tipo:'cuerda'});
  }
  _cue.cantidad=1;
  closeModal();
  setTimeout(()=>renderPbItems(),100);
  showToast(`✅ ${_cue.cantidad||1} cuerda(s) agregada(s) al presupuesto`);
}

function guardarPresupuesto(editId){
  const clienteId=parseInt(document.getElementById('pb-c').value);

  if(!clienteId){showToast('Selecciona un cliente');return;}
  if(!pbItems.length){showToast('Agrega al menos un servicio o producto');return;}

  if(editId){
    // Editar presupuesto existente
    const idx=state.presupuestos.findIndex(x=>x.id===editId);
    if(idx>=0){
      state.presupuestos[idx]={...state.presupuestos[idx],clienteId,pianoId,items:[...pbItems]};
      saveState();closeModal();
      showToast('✅ Presupuesto actualizado');
      renderPresupuesto();

    return;

  // Nuevo presupuesto
  const newP={id:nextId(),clienteId,pianoId,fecha:new Date().toISOString().split('T')[0],items:[...pbItems]};

}

function exportarJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pianos_data.json';a.click();URL.revokeObjectURL(url);showToast('Archivo descargado ✓');
}
function importarJSON(inp){
  const file=inp.files[0];if(!file)return;const r=new FileReader();
  r.onload=e=>{try{const data=JSON.parse(e.target.result);if(!data.clientes||!data.citas)throw new Error('Formato inválido');
    Object.assign(state,data);saveState();showToast('Datos importados ✓');renderConfig();}
    catch(err){showToast('Error: '+err.message,4000);}};
  r.readAsText(file);
}
function resetDatos(){if(!confirm('¿Resetear TODOS los datos? Es irreversible.'))return;Object.assign(state,defaultState());saveState();navigate('inicio');showToast('Datos reseteados');}

// ══ PWA: SERVICE WORKER ══
if('serviceWorker' in navigator){
  const swCode=`
const CACHE='pianotune-v2.9.4'; // v2.9.4
const ASSETS=['/'];
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
});
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(
    caches.match(e.request).then(cached=>{
      const fresh=fetch(e.request).then(res=>{
        if(res&&res.status===200&&res.type==='basic'){
          const clone=res.clone();
          caches.open(CACHE).then(c=>c.put(e.request,clone));
        }
        return res;
      }).catch(()=>cached);
      return cached||fresh;
    })
  );
});
  `;
  const swBlob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl,{scope:'./'}).catch(()=>{});
}

// ── Iniciar servicio (actualizado) ──
function iniciarServicio(citaId){
  showToast('Obteniendo posición GPS…');
  capturarGPS(
    (lat,lon)=>{
      const c=state.citas.find(x=>x.id===citaId);
      if(!c)return;
      c.estado='en_curso';
      if(!c.visitas)c.visitas=[];
      if(!c.ordenServicio)c.ordenServicio={items:[],notas:'',fechaCierre:null};
      // Init orden from presupuesto if exists
      if(!c.ordenServicio.items.length){
        const presup=state.presupuestos.find(p=>p.clienteId===c.clienteId&&p.pianoId===c.pianoId);
        if(presup)c.ordenServicio.items=[...presup.items.map(i=>({...i}))];
        else c.ordenServicio.items=[{nombre:c.servicio,precio:c.precio}];
      }
      const hoy=new Date().toISOString().split('T')[0];
      c.visitas.push({fecha:hoy,horasAprox:0,kmIda:0,latInicio:lat,lonInicio:lon,notas:''});
      state.sesionActiva={citaId,inicio:Date.now(),latInicio:lat,lonInicio:lon};
      saveState();closeModal();showToast('Servicio iniciado ✓');renderInicio();
    },
    ()=>{
      const c=state.citas.find(x=>x.id===citaId);
      if(!c)return;
      c.estado='en_curso';
      if(!c.visitas)c.visitas=[];
      if(!c.ordenServicio)c.ordenServicio={items:[],notas:'',fechaCierre:null};
      if(!c.ordenServicio.items.length){
        const presup=state.presupuestos.find(p=>p.clienteId===c.clienteId&&p.pianoId===c.pianoId);
        if(presup)c.ordenServicio.items=[...presup.items.map(i=>({...i}))];
        else c.ordenServicio.items=[{nombre:c.servicio,precio:c.precio}];
      }
      const hoy=new Date().toISOString().split('T')[0];
      c.visitas.push({fecha:hoy,horasAprox:0,kmIda:0,notas:''});
      state.sesionActiva={citaId,inicio:Date.now(),latInicio:null,lonInicio:null};
      saveState();closeModal();showToast('Servicio iniciado (sin GPS)');renderInicio();
    }
  );
}

function guardarVisita(citaId){
  const c=state.citas.find(x=>x.id===citaId);if(!c)return;
  if(!c.visitas)c.visitas=[];
  c.visitas.push({
    fecha:document.getElementById('av-f').value,
    horasAprox:parseFloat(document.getElementById('av-h').value)||0,
    notas:document.getElementById('av-n').value.trim(),
    kmIda:0
  });
  // Also capture GPS for km
  capturarGPS(
    (lat,lon)=>{
      const vis=c.visitas[c.visitas.length-1];
      const cli=getCliente(c.clienteId);
      if(cli&&cli.lat&&cli.lon)vis.kmIda=distKm(lat,lon,cli.lat,cli.lon);
      state.kmTotal+=vis.kmIda*2;
      saveState();closeModal();showToast('Visita registrada ✓ +'+( vis.kmIda*2).toFixed(1)+'km');renderInicio();
    },
    ()=>{saveState();closeModal();showToast('Visita registrada ✓');renderInicio();}
  );
}

function _generarDocPDF(c, tipo){

  const totalConIva=items.reduce((s,i)=>s+Number(i.precio),0);
  // Precios capturados c/IVA incluido → desglozar: base = total/1.16
  const subtotalBase=Math.round(totalConIva/1.16*100)/100;
  const ivaDoc=Math.round((totalConIva-subtotalBase)*100)/100;
  const subtotal=subtotalBase;
  const montoCobrado=c.cobro?.monto||totalConIva;
  const tecNombre=tec.nombre||'Sergio L. Ruiz Jones';

  const esCobro=tipo==='cp';
  const folio=(esCobro?'CP-':'OS-')+String(c.id).padStart(4,'0')+'-'+fecha.getFullYear();
  const titulo=esCobro?'COMPROBANTE DE PAGO':'ORDEN DE SERVICIO';

  function nL(n){
    const u=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
    const d=['','diez','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
    const cc=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
    if(n===0)return'cero';if(n===100)return'cien';
    let r='';
    if(n>=1000){const m=Math.floor(n/1000);r+=(m===1?'mil':nL(m)+' mil')+' ';n=n%1000;}
    if(n>=100){r+=cc[Math.floor(n/100)]+' ';n=n%100;}
    if(n>20){r+=d[Math.floor(n/10)]+(n%10?' y '+u[n%10]:'');}else if(n>0)r+=u[n];
    return r.trim();
  }
  const montoFinal=esCobro?montoCobrado:totalConIva;
  const te=Math.floor(montoFinal);const tc=Math.round((montoFinal-te)*100);
  const tLetras=nL(te).toUpperCase()+' PESOS '+String(tc).padStart(2,'0')+'/100 M.N.';

  const filas=[...items];while(filas.length<12)filas.push({nombre:'',precio:''});

  </tr>`).join('');

  const visitasHTML=c.visitas&&c.visitas.length?`
  <div style="border:1px solid #ddd;border-radius:3px;padding:3mm 4mm;margin-bottom:3mm;font-family:Arial,sans-serif;font-size:9pt">
    <div style="font-weight:700;font-size:8pt;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-bottom:2mm">Registro de visitas</div>
    ${c.visitas.map((v,i)=>`<div style="display:flex;gap:4mm;border-bottom:1px solid #eee;padding:1.5mm 0">
      <span style="color:#666">Visita ${i+1}:</span>
      <span><b>${fmtDate(v.fecha)}</b>${v.horasAprox?' · '+v.horasAprox+'h':''}</span>
      ${v.notas?`<span style="color:#666;flex:1">· ${v.notas}</span>`:''}

    <div style="font-size:8.5pt;color:#444;margin-top:2mm">Total horas: <b>${c.visitas.reduce((s,v)=>s+(v.horasAprox||0),0)}h</b></div>
  </div>`:'';

  const pagoInfo=esCobro&&c.cobro?`
  <div style="border:1.5px solid #111;border-radius:3px;padding:3mm 4mm;margin-top:3mm;font-family:Arial,sans-serif">
    <div style="font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#111;margin-bottom:2mm">Información de pago</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2mm;font-size:9.5pt">
      <div><span style="color:#666">Forma:</span> <b>${c.cobro.formaPago==='efectivo'?'💵 Efectivo':c.cobro.formaPago==='transferencia'?'💳 Transferencia':'💳 Tarjeta'}</b></div>

      ${c.cobro.anticipo?`<div><span style="color:#666">Anticipo:</span> <b>${fmtMoney(c.cobro.anticipo)}</b></div>`:''}

*{box-sizing:border-box;margin:0;padding:0}

.page{width:216mm;min-height:279mm;margin:0 auto;padding:9mm 11mm 8mm;background:#fff}
.hdr{width:100%;margin-bottom:4mm;line-height:0}
.hdr-logo{display:none}
.hdr-logo img{width:100%;height:100%;object-fit:cover;display:block;max-height:28mm}
.hdr-brand{display:none}
.hdr-brand img{max-width:90%;max-height:20mm;object-fit:contain}
.hdr-tipo{font-family:Arial,sans-serif;font-size:8.5pt;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#555;margin-top:2mm}
.folio-row{display:flex;justify-content:space-between;align-items:center;margin:2mm 0 3mm}

.fecha-txt{font-size:9pt;color:#444;font-style:italic}
.ig{border:1.5px solid #c9daf8;margin-bottom:3mm;font-family:Arial,sans-serif}

.ig-hdr span{color:#fff;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.ig-row{display:grid;border-bottom:1px solid #c9daf8}
.ig-row:last-child{border-bottom:none}
.ig-row.c2{grid-template-columns:1fr 1fr}
.ig-row.c3{grid-template-columns:1fr 1fr 1fr}

.ig-cell:last-child{border-right:none}

.iv{font-size:9.5pt;color:#111;font-weight:600}
.tw{border:1.5px solid #c9daf8}
table{width:100%;border-collapse:collapse}
thead tr{background:#1a56db}
thead th{color:#fff;padding:2.5mm 5mm;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:Arial,sans-serif}
tbody tr:nth-child(even){background:#e8f0fe}
.totales-wrap{display:grid;grid-template-columns:1fr auto;gap:4mm;margin-top:3mm;align-items:end}
.vbox{border:1.5px solid #c9daf8;padding:2.5mm 4mm}
.vtit{font-size:7pt;font-weight:700;text-transform:uppercase;color:#111;margin-bottom:1mm;font-family:Arial,sans-serif}
.lbox{border:1.5px solid #aaa;padding:2mm 4mm;margin-top:2mm;background:#f7f7f7}
.ltit{font-size:7pt;font-weight:700;text-transform:uppercase;color:#444;font-family:Arial,sans-serif}
.lval{font-size:8.5pt;font-style:italic;color:#222;margin-top:.5mm}
.ttbl{border:1.5px solid #c9daf8;min-width:52mm;font-family:Arial,sans-serif}
.ttbl table{margin:0}
.ttbl td{padding:2.5mm 4mm;border-bottom:1px solid #ddd;font-size:9pt}
.ttbl tr:last-child td{border-bottom:none}
.ttotal{background:#1a56db}
.ttotal td{color:#fff!important;font-size:11pt!important;font-weight:700!important;padding:3mm 4mm!important}
.footer{margin-top:4mm;border-top:2px solid #c9daf8;padding-top:3mm;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;font-family:Arial,sans-serif}
.fi{font-size:7.5pt;color:#333}
.fi strong{display:block;font-size:8pt;font-weight:700;color:#111;margin-bottom:.5mm}
.action-bar{width:216mm;margin:0 auto 5mm;display:flex;gap:8px;justify-content:flex-end;font-family:Arial,sans-serif}
.bp{padding:8px 18px;border-radius:5px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.bpp{background:#1a56db;color:#fff}.bpg{background:#fff;color:#1a56db;border:1.5px solid #1a56db}
@media print{.action-bar{display:none!important}.page{width:100%;min-height:auto;padding:7mm 9mm 5mm}@page{size:letter portrait;margin:8mm 10mm}.footer{position:relative;margin-top:3mm;page-break-inside:avoid}}

function abrirPDF(presupuestoId, ivaDesglosado){
  const p=state.presupuestos.find(x=>x.id===presupuestoId);
  const cli=getCliente(p.clienteId);
  const piano=p.pianoId?getPiano(p.clienteId,p.pianoId):cli&&cli.pianos[0];
  const tec=state.tecnico||{};
  const fecha=new Date();
  const fechaStr=fecha.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  const folio='PP-'+String(p.id).padStart(4,'0')+'-'+fecha.getFullYear();
  const totalConIva=p.items.reduce((s,i)=>s+Number(i.precio),0);
  // Precios c/IVA incluido → base = totalConIva/1.16
  const subtotal=ivaDesglosado?Math.round(totalConIva/1.16*100)/100:totalConIva;
  const iva=ivaDesglosado?Math.round((totalConIva-subtotal)*100)/100:0;
  const total=totalConIva;
  const tecNombre=tec.nombre||'Sergio L. Ruiz Jones';
  const tecTel=tec.telefono||'272 118 8088';
  const tecEmail=tec.email||'contacto@pianosandpianos.com';

  function nL(n){
    const u=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
    const d=['','diez','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
    const cc=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
    if(n===0)return'cero';if(n===100)return'cien';
    let r='';
    if(n>=1000){const m=Math.floor(n/1000);r+=(m===1?'mil':nL(m)+' mil')+' ';n=n%1000;}
    if(n>=100){r+=cc[Math.floor(n/100)]+' ';n=n%100;}
    if(n>20){r+=d[Math.floor(n/10)]+(n%10?' y '+u[n%10]:'');}else if(n>0)r+=u[n];
    return r.trim();
  }

    <td style="text-align:right;padding:3.5mm 5mm;border-left:1px solid #ddd;font-size:10pt;white-space:nowrap;border-bottom:1px solid #e8f0fe">${precioStr}</td>
  </tr>`;}).join('');

function toggleOsItems(id){

// ══ PAUSAR SERVICIO ══
function modalPausarServicio(citaId){
  const c=state.citas.find(x=>x.id===citaId);if(!c)return;
  const vis=c.visitas||[];
  const hoy=new Date().toISOString().split('T')[0];
  const ultimaVisita=vis.find(v=>v.fecha===hoy);
  openModal(`<div class="modal-title">⏸ Pausar servicio</div>
  <p style="font-size:14px;color:var(--text2);margin-bottom:14px">El servicio quedará pausado hasta la próxima visita.</p>
  <div class="input-group"><label class="input-label">Horas trabajadas hoy</label>
    <input type="number" class="input" id="ps-h" value="${ultimaVisita?.horasAprox||2}" step="0.5" min="0.5" max="12"></div>
  <div class="input-group"><label class="input-label">Notas de hoy (opcional)</label>
    <textarea class="input" id="ps-n" rows="2" placeholder="Avances del día…">${ultimaVisita?.notas||''}</textarea></div>
  <button class="btn btn-primary btn-full" onclick="confirmarPausa(${citaId})">⏸ Confirmar pausa</button>`);
}

function confirmarPausa(citaId){
  const c=state.citas.find(x=>x.id===citaId);if(!c)return;
  const horas=parseFloat(document.getElementById('ps-h').value)||0;
  const notas=document.getElementById('ps-n').value.trim();
  const hoy=new Date().toISOString().split('T')[0];
  if(!c.visitas)c.visitas=[];
  // Update today's visit or add new one
  const visHoy=c.visitas.find(v=>v.fecha===hoy);
  if(visHoy){visHoy.horasAprox=horas;visHoy.notas=notas;}
  else c.visitas.push({fecha:hoy,horasAprox:horas,notas,kmIda:0});
  c.estado='pausado';
  c.pausadaEl=hoy;
  // Stop GPS session
  if(state.sesionActiva&&state.sesionActiva.citaId===citaId)state.sesionActiva=null;
  saveState();closeModal();showToast('Servicio pausado ✓');renderInicio();
}

// ══ RETOMAR SERVICIO ══
function retomarServicio(citaId){
  showToast('Obteniendo GPS…');
  capturarGPS(
    (lat,lon)=>{
      const c=state.citas.find(x=>x.id===citaId);if(!c)return;
      c.estado='en_curso';delete c.pausadaEl;
      if(!c.visitas)c.visitas=[];
      const hoy=new Date().toISOString().split('T')[0];
      if(!c.visitas.find(v=>v.fecha===hoy))
        c.visitas.push({fecha:hoy,horasAprox:0,notas:'',kmIda:0,latInicio:lat,lonInicio:lon});
      const cli=getCliente(c.clienteId);
      if(cli&&cli.lat&&cli.lon){
        const km=distKm(lat,lon,cli.lat,cli.lon);
        const vis=c.visitas[c.visitas.length-1];vis.kmIda=km;
        state.kmTotal+=km*2;
      }
      state.sesionActiva={citaId,inicio:Date.now(),latInicio:lat,lonInicio:lon};
      saveState();showToast('Servicio retomado ✓');renderInicio();
    },
    ()=>{
      const c=state.citas.find(x=>x.id===citaId);if(!c)return;
      c.estado='en_curso';delete c.pausadaEl;
      const hoy=new Date().toISOString().split('T')[0];
      if(!c.visitas)c.visitas=[];
      if(!c.visitas.find(v=>v.fecha===hoy))c.visitas.push({fecha:hoy,horasAprox:0,notas:'',kmIda:0});
      state.sesionActiva={citaId,inicio:Date.now(),latInicio:null,lonInicio:null};
      saveState();showToast('Servicio retomado (sin GPS)');renderInicio();
    }
  );
}

// ══ AUTO-PAUSA ══
function checkAutoPausa(){
  const hora=new Date().getHours();
  const pausaHora=(state.tecnico&&state.tecnico.pausaHora)||20;
  if(hora>=pausaHora){
    const activos=state.citas.filter(c=>c.estado==='en_curso');
    if(activos.length){
      activos.forEach(c=>{
        c.estado='pausado';
        c.pausadaEl=new Date().toISOString().split('T')[0];
        if(!c.visitas)c.visitas=[];
        const hoy=new Date().toISOString().split('T')[0];
        if(!c.visitas.find(v=>v.fecha===hoy))
          c.visitas.push({fecha:hoy,horasAprox:0,notas:'Auto-pausado',kmIda:0});
      });
      if(state.sesionActiva)state.sesionActiva=null;
      saveState();
      // Show notification to capture hours
      showToast(`⏸ ${activos.length} servicio(s) auto-pausados a las ${pausaHora}:00`,5000);
      setTimeout(()=>{
        activos.forEach(c=>{
          openModal(`<div class="modal-title">⏸ Auto-pausa activada</div>
          <p style="font-size:14px;color:var(--text2);margin-bottom:14px">El servicio se pausó automáticamente. ¿Cuántas horas trabajaste hoy?</p>
          <div class="input-group"><label class="input-label">Horas trabajadas</label>
            <input type="number" class="input" id="ap-h" value="2" step="0.5" min="0"></div>
          <button class="btn btn-primary btn-full" onclick="guardarHorasAutoPausa(${c.id})">Guardar</button>`);
        });
      },1000);
      renderInicio();
    }
  }
}
function guardarHorasAutoPausa(citaId){
  const c=state.citas.find(x=>x.id===citaId);if(!c)return;
  const horas=parseFloat(document.getElementById('ap-h').value)||0;

  state.clientes.forEach(cli=>{

          );

      }

// ── Datos de notas (1=A0/La-0 ... 88=C8/Do-8) ─────────────
const NOTAS_EN = ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'];
const NOTAS_ES = ['La','La#','Si','Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#'];
function notaNombre(n){
  const idx=n-1, oct=Math.floor(idx/12), ni=idx%12;
  return `${NOTAS_EN[ni]}${oct} / ${NOTAS_ES[ni]}-${oct}`;
}

// ── Categorías y límites derivados de 88 escalas Pscale ────
const CUE_CATS = {
  vertical: [
    {id:'esp', label:"Espineta",    anchor:300, dw:11, wound:30},
    {id:'con', label:"Consola",     anchor:319, dw:11, wound:27},
    {id:'est', label:"Estudio",     anchor:340, dw:10, wound:27},
    {id:'pro', label:"Profesional", anchor:361, dw: 9, wound:28},
  ],
  cola: [
    {id:'baby', label:'Baby Grand (hasta 5p4)',    anchor:378, dw:10, wound:25},
    {id:'med',  label:'Medium Grand (5p4 - 6p2)',  anchor:400, dw: 9, wound:24},
    {id:'par',  label:'Parlor / Semi (6p2 - 7p4)', anchor:430, dw: 8, wound:23},
    {id:'con',  label:'Concert Grand (7p4+)',      anchor:531, dw: 7, wound:21},
  ]
};

// ── Factores por tipo de cuerda ────────────────────────────
function getCueFactor(tipo){ // 'dw'|'bass'|'mid'|'high'
  const s=state.cueFactores||{};
  if(tipo==='dw')   return s.dw   || 1.85;
  if(tipo==='bass') return s.bass || 1.38;
  if(tipo==='mid')  return s.mid  || 1.18;
  return 1.0; // high bass
}

function getCueAnchor(pianoTipo, catId){
  const ovr = (state.cueAnchors||{})[pianoTipo+'_'+catId];
  if(ovr) return ovr;
  const cats = CUE_CATS[pianoTipo]||[];
  return (cats.find(c=>c.id===catId)||{}).anchor||300;
}

function detectTipoCuerda(nota, cat){
  if(nota <= cat.dw) return 'dw';
  const midStart = cat.dw + 1;
  const midEnd   = cat.wound - 5;
  const bassEnd  = midStart + 9;
  if(nota <= bassEnd) return 'bass';
  if(nota <= midEnd)  return 'mid';
  return 'high';
}

function tipoCuerdaLabel(t){
  return {dw:'Low Bass (Double wound)',bass:'Bass (Single thick)',
    mid:'Mid Bass (Single mid)',high:'High Bass (Single thin)'}[t]||t;
}

// ── Estado del cotizador ───────────────────────────────────
let _cue = {tipo:'vertical', catId:'esp', nota:1, cantidad:1, items:[]};

function renderCotizadorCuerdas(){
  const tipo = _cue.tipo;
  const cats = CUE_CATS[tipo];
  const cat  = cats.find(c=>c.id===_cue.catId) || cats[0];
  _cue.catId = cat.id;

  // Notas disponibles (1 a cat.wound)
  const notaOpts = Array.from({length:cat.wound},(_,i)=>i+1)
